version: '3.8'

# ─── Production Docker Compose ────────────────────────────────────────────────
# Architecture:
#   - Central server at HQ runs all services
#   - Remote locations (offshore platforms, branches) have ZKTeco readers only
#   - Readers push attendance data via ADMS to HQ server (port 80 → /iclock/)
#   - Users access the system via HTTPS (port 443)
#
# Usage:
#   First deploy:  ./scripts/deploy.sh
#   Update:        ./scripts/deploy.sh update
#
# ZKTeco ADMS device configuration:
#   Server address: http://<HQ_SERVER_IP>   (port 80, HTTP — many readers don't support HTTPS)
#   The nginx config passes /iclock/ on port 80 directly to the backend
#
# IMPORTANT — direct-IP (ZKLib/port 4370) readers and auto-discovery of new readers:
#   The `backend` container runs on the `pob_internal` Docker bridge network, so its
#   own network interfaces are NOT the reader LAN. You MUST set DEVICE_SCAN_SUBNETS
#   in .env.prod to the actual reader subnet (e.g. 192.168.1.0/24) or new readers
#   will never be auto-discovered. After deploy, verify with:
#     GET /api/device/network-diagnostics
#   Also confirm the Docker host itself can route to the reader LAN (same network,
#   VPN, or routed VLAN) — outbound TCP/4370 and inbound TCP/80 must both work.
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: pob_postgres
    env_file: .env.prod
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: >
      postgres
      -c max_connections=300
      -c shared_buffers=512MB
      -c effective_cache_size=2GB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c log_min_duration_statement=1000
      -c log_connections=on
      -c log_disconnections=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME} -q"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - pob_internal
    restart: unless-stopped

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pob_redis
    command: redis-server /etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./docker/redis.conf:/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pob_internal
    restart: unless-stopped

  # ── DB Init (runs once on first deploy, then exits) ─────────────────────────
  db-init:
    # Runs on the BACKEND image so it has psql + python + the app code: it applies
    # the complete schema and seeds the global admin user in one step.
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pob_backend:latest
    container_name: pob_db_init
    working_dir: /app
    env_file: .env.prod
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_URL: postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}
      GLOBAL_ADMIN_USERNAME: ${GLOBAL_ADMIN_USERNAME:-globaladmin}
    volumes:
      - ./docker/db-init.sh:/db-init.sh:ro
      - ./database/init/complete_schema.sql:/migrations/complete_schema.sql:ro
      - ./database/init/incremental.sql:/migrations/incremental.sql:ro
    entrypoint: ["/bin/bash", "/db-init.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pob_internal
    restart: "no"

  # ── Backend API ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: pob_backend:latest
    container_name: pob_backend
    env_file: .env.prod
    environment:
      - DATABASE_URL=postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENVIRONMENT=production
      - BACKUP_DIR=/backups
    volumes:
      - uploads_data:/app/uploads
      - media_data:/app/media
      - logs_data:/app/logs
      - ${BACKUP_DIR:-db_backups}:/backups
      # The backend applies pending migrations itself at startup (see
      # _apply_pending_migrations in main.py). db-init still runs them on a full
      # `up`, but `docker compose restart` skips db-init entirely — so without
      # this the schema silently stops moving while the code moves on.
      - ./database/init/incremental.sql:/migrations/incremental.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - pob_internal
      # Also on the external bridge so the backend has OUTBOUND access to the
      # reader LAN (direct-IP ZKLib scans on :4370) and the internet (SMTP/SMS/
      # WhatsApp/SeamlessHR). pob_internal alone is internal:true = no egress.
      - pob_external
    restart: unless-stopped

  # ── Celery Worker ───────────────────────────────────────────────────────────
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    image: pob_celery:latest
    container_name: pob_celery_worker
    env_file: .env.prod
    environment:
      - DATABASE_URL=postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - uploads_data:/app/uploads
      - media_data:/app/media
      - logs_data:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pob_internal
      # Egress for reader-LAN polling + notification/HR API calls (see backend).
      - pob_external
    restart: unless-stopped

  # ── Celery Beat (periodic task scheduler) ──────────────────────────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    image: pob_celery:latest
    container_name: pob_celery_beat
    env_file: .env.prod
    environment:
      - DATABASE_URL=postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}
    command: ["celery", "-A", "celery_worker.app", "beat", "--loglevel=info", "--schedule=/app/celerybeat/celerybeat-schedule"]
    volumes:
      # Mount ONLY the schedule-state dir (NOT all of /app) — mounting a named
      # volume over /app shadows the image's code and pins celery-beat to a stale
      # copy, so code updates never take effect. Keep app code from the image.
      - celerybeat_data:/app/celerybeat
      - logs_data:/app/logs
    depends_on:
      - redis
      - celery-worker
    networks:
      - pob_internal
    restart: unless-stopped

  # ── Frontend (nginx + built React) ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    image: pob_frontend:latest
    container_name: pob_frontend
    volumes:
      - uploads_data:/usr/share/nginx/uploads:ro
      - media_data:/usr/share/nginx/media:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - pob_internal
    restart: unless-stopped

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  # Port 80:  ZKTeco ADMS push (/iclock/) + HTTP→HTTPS redirect for browsers
  # Port 443: HTTPS for all users (frontend + API + WebSocket)
  nginx:
    image: nginx:alpine
    container_name: pob_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/certbot-webroot:/var/www/certbot:ro
      - uploads_data:/var/www/uploads:ro
      - media_data:/var/www/media:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - pob_internal
      - pob_external
    restart: unless-stopped

  # ── Automated Database Backup ───────────────────────────────────────────────
  # Runs pg_dump daily at 02:00. Keeps 7 daily + 4 weekly + 3 monthly backups.
  #
  # NAS storage: set BACKUP_DIR in .env.prod to your NAS mount point, e.g.:
  #   BACKUP_DIR=/mnt/nas-backups
  # The volume below uses that path as a bind mount so backups go directly to NAS.
  # If BACKUP_DIR is not set, backups land in the local db_backups Docker volume.
  db-backup:
    image: postgres:15-alpine
    container_name: pob_db_backup
    env_file: .env.prod
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      PGPASSWORD: ${DATABASE_PASSWORD}
      BACKUP_RETAIN_DAYS: "7"
      BACKUP_RETAIN_WEEKS: "4"
      BACKUP_RETAIN_MONTHS: "3"
    volumes:
      - ${BACKUP_DIR:-db_backups}:/backups
      - ./docker/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "echo '0 2 * * * /bin/sh /backup.sh >> /backups/backup.log 2>&1' | crontab - && crond -f -d 8"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pob_internal
    restart: unless-stopped

  # ── Backend also needs access to backup dir (for UI-triggered backups) ──────
  # The backend's /api/v1/backup endpoints write to BACKUP_DIR via pg_dump subprocess.

  # ── Prometheus (metrics collection) ────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: pob_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - pob_internal
    restart: unless-stopped

  # ── Grafana (monitoring dashboards) ────────────────────────────────────────
  # Access at: https://your-domain.com/monitoring
  grafana:
    image: grafana/grafana:latest
    container_name: pob_grafana
    env_file: .env.prod
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?set a strong GRAFANA_PASSWORD in .env.prod}
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/monitoring
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - pob_internal
    restart: unless-stopped

  # ── Alertmanager (routes Prometheus alerts to email/Slack/PagerDuty) ─────────
  alertmanager:
    image: prom/alertmanager:latest
    container_name: pob_alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    environment:
      - ALERTMANAGER_SMTP_HOST=${ALERTMANAGER_SMTP_HOST:-smtp.example.com}
      - ALERTMANAGER_SMTP_PORT=${ALERTMANAGER_SMTP_PORT:-587}
      - ALERTMANAGER_EMAIL_FROM=${ALERTMANAGER_EMAIL_FROM:-alerts@example.com}
      - ALERTMANAGER_EMAIL_TO=${ALERTMANAGER_EMAIL_TO:-oncall@example.com}
      - ALERTMANAGER_SMTP_USER=${ALERTMANAGER_SMTP_USER:-}
      - ALERTMANAGER_SMTP_PASSWORD=${ALERTMANAGER_SMTP_PASSWORD:-}
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    depends_on:
      - prometheus
    networks:
      - pob_internal
    restart: unless-stopped

  # ── PostgreSQL Exporter ─────────────────────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: pob_postgres_exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME}?sslmode=disable"
    depends_on:
      - postgres
    networks:
      - pob_internal
    restart: unless-stopped

  # ── Redis Exporter ──────────────────────────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: pob_redis_exporter
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      - redis
    networks:
      - pob_internal
    restart: unless-stopped

  # ── Cloudflare Tunnel — remote web access with NO inbound ports ──────────────
  # The connector dials OUT to Cloudflare's edge (needs egress → pob_external) and
  # exposes the app at the hostname configured in the Zero Trust dashboard, routed
  # to the local nginx. Public-hostname + TLS settings live in the dashboard; the
  # connector token lives in .env.prod (CLOUDFLARE_TUNNEL_TOKEN) — never committed.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: pob_cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    networks:
      - pob_external
    restart: unless-stopped

# ── Named Volumes ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local
  media_data:
    driver: local
  logs_data:
    driver: local
  alertmanager_data:
    driver: local
  celerybeat_data:
    driver: local
  nginx_logs:
    driver: local
  db_backups:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ── Networks ───────────────────────────────────────────────────────────────────
networks:
  pob_internal:
    name: pob_internal
    driver: bridge
    internal: true
  pob_external:
    name: pob_external
    driver: bridge
